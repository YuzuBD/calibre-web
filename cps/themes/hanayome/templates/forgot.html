{% extends theme("layout.html") %}
{% block body %}
<div class="hy-reg-min" id="hy-forgot-root">
  <a class="hy-reg-brand" href="{{url_for('web.login')}}">{{instance}}</a>

  <div class="hy-reg-card">
    <h2 class="hy-reg-title">{{_('Reset password')}}</h2>

    <p class="hy-forgot-note">{{_('Enter your username or email and we will send you a new password.')}}</p>

    {% if error %}
    <div class="hy-login-error">
      <span class="glyphicon glyphicon-alert" aria-hidden="true"></span>
      <span>{{error}}</span>
    </div>
    {% endif %}

    <form method="POST" role="form" class="hy-login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group hy-field">
        <label for="username">{{_('Username or email')}}</label>
        <input type="text" class="form-control hy-input" id="username" name="username"
               placeholder="{{_('Username or email')}}" value="{{ username }}" required autofocus>
      </div>

      <button type="submit" id="submit" class="hy-login-go">{{_('Send reset email')}}</button>
    </form>

    <p class="hy-reg-alt">
      <a href="{{url_for('web.login')}}" id="to-login" class="hy-link">{{_('Back to login')}}</a>
    </p>
  </div>
</div>
{% endblock %}
